# Identical to broker-baseline.conf except for the experimental observer.
listener 1883
listener_allow_anonymous false
persistence false
log_dest stdout
log_type notice
log_type error
log_type warning
global_plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /tmp/a1p-dynsec.json
global_plugin /poc/observer.so
plugin_opt_usernames poc-a,poc-b,poc-reader
plugin_opt_client_id_prefix poc-
plugin_opt_topic_prefixes poc/shared,poc/long/
plugin_opt_events CONNECT,DISCONNECT,PUBLISH_IN,MESSAGE_OUT,SUBSCRIBE
plugin_opt_max_events 1000
